# Codemagic lit uniquement ce fichier à la racine du dépôt.
# App Flutter : rh_mobile_app (RH Connect).
# Docs : https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Workflow par défaut = compile iOS SANS profil Apple (pas d’IPA installable).
# Pour un iPhone réel : ajouter certificat + profil dans Codemagic, puis lancer
# manuellement « RH Connect iOS (signé) ».
# API LAN iPhone : API_BASE_URL = http://<IP-PC>:8080

workflows:
  rh-connect-ios:
    name: RH Connect iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: rh_mobile_app
    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: tn.agua.rhconnect
        API_BASE_URL: http://127.0.0.1:8080
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: develop_4
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install
      - name: Analyze
        script: flutter analyze
        ignore_failure: true
      - name: Unit tests
        script: flutter test
      - name: Build iOS (unsigned — no Apple profile required)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${BUILD_NUMBER:-$PROJECT_BUILD_NUMBER} \
            --dart-define="API_BASE_URL=$API_BASE_URL"
    artifacts:
      - rh_mobile_app/build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  rh-connect-ios-signed:
    name: RH Connect iOS (signé)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: rh_mobile_app
    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: tn.agua.rhconnect
      vars:
        BUNDLE_ID: tn.agua.rhconnect
        API_BASE_URL: http://127.0.0.1:8080
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=${BUILD_NUMBER:-$PROJECT_BUILD_NUMBER} \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define="API_BASE_URL=$API_BASE_URL"
    artifacts:
      - rh_mobile_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  rh-connect-android:
    name: RH Connect Android (manuel)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: rh_mobile_app
    environment:
      flutter: 3.29.2
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/rh_mobile_app/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Unit tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - rh_mobile_app/build/**/outputs/**/*.apk
