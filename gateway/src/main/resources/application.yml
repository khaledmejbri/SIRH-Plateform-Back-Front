spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # Spring Cloud Gateway 5.x (starter gateway-server-webflux)
      server:
        webflux:
          # Mobile / SPA dev: allow browser or tooling preflight when hitting the gateway.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: '*'
                allowCredentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            # Auth + OAuth2 first (narrow paths; no overlap with /api/rh).
            - id: svc-identite-acces
              uri: lb://svc-identite-acces
              predicates:
                - Path=/api/auth/**,/oauth2/**,/.well-known/**
            - id: svc-evaluation
              uri: lb://svc-evaluation
              predicates:
                - Path=/api/rh/v1/evaluations/**,/api/rh/v1/admin/evaluations/**,/api/rh/v1/mobile/evaluations/**
            - id: svc-presence
              uri: lb://svc-presence
              predicates:
                - Path=/api/rh/v1/presence/**,/api/rh/v1/admin/presence/**,/api/rh/v1/mobile/presence/**
            - id: svc-referentiel-rh-v1
              uri: lb://svc-referentiel-rh
              predicates:
                - Path=/api/rh/v1/**
            - id: svc-referentiel-rh
              uri: lb://svc-referentiel-rh
              predicates:
                - Path=/api/referentiel/**
            - id: svc-notification
              uri: lb:ws://svc-notification
              predicates:
                - Path=/ws,/ws/**,/ws-sockjs,/ws-sockjs/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
